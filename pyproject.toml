[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mazegen"]

[project]
name = "mazegen"
packages = ["mazegen"]
version = "1.0.0"
description = "A maze generator."
authors = [
	{name = "alvespin"},
	{name = "paduarte"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy (>=2.2.6)"
]
license = "MIT"
license-files = ["LICENCE.md"]
